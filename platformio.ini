; BMCam adapter: USB-Ethernet (NCM) <-> Wi-Fi AP bridge for ESP32-S3.
; ESP-IDF (not Arduino): Arduino 2.0.17 has no TinyUSB network class.

[env]
build_flags = -std=gnu++17

[device]
platform = espressif32@8.0.0
framework = espidf
board = m5stack-stamps3
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; Cardputer ADV: ST7789 screen, G0 button, RGB LED.
[env:cardputer]
extends = device
build_flags = ${env.build_flags} -DBOARD_CARDPUTER=1

; Bare ESP32-S3 board with one button (no screen). Button pin: BOARD_BUTTON_GPIO.
[env:generic]
extends = device
build_flags = ${env.build_flags} -DBOARD_GENERIC=1 -DBOARD_BUTTON_GPIO=0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = ${env.build_flags} -I src -Wall -Wextra
build_src_filter = -<*> +<logic/*>
